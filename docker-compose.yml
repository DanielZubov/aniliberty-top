services:
  anilibria-torznab:
    image: ghcr.io/danielzubov/aniliberty-top:latest
    container_name: anilibria-torznab
    restart: unless-stopped
    ports:
      - "8020:8020"
    networks:
      - srv_proxy
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1


networks:
  srv_proxy:
    external: true